<!-- Group page: same layout as the homepage, scoped to this group's events -->

<app-hero-slider
  [events]="events"
  [isLoading]="isLoading"
  (scrollToEvents)="onScrollToEvents()">
</app-hero-slider>

<div id="event-list">
  <app-event-list
    [events]="events"
    [isLoading]="isLoading"
    [error]="error"
    (retryLoad)="onRetryLoad()">
  </app-event-list>
</div>

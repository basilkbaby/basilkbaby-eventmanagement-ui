<div class="group-page">

  <!-- Group header -->
  <header class="group-hero" *ngIf="!loading && !error">
    <a class="group-hero__back" routerLink="/events">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      All events
    </a>
    <div class="group-hero__eyebrow">Tour / Artist</div>
    <h1 class="group-hero__title">{{ groupName }}</h1>
    <p class="group-hero__sub" *ngIf="events.length">
      {{ events.length }} {{ events.length === 1 ? 'date' : 'dates' }} across venues
    </p>
  </header>

  <!-- Events for the group (reuses the standard event list) -->
  <app-event-list
    [events]="events"
    [isLoading]="loading"
    [error]="error">
  </app-event-list>

  <!-- Empty (group exists but no active events) -->
  <div class="group-empty" *ngIf="!loading && !error && events.length === 0">
    <h2>No dates available</h2>
    <p>There are currently no events for this group. Please check back later.</p>
    <a class="group-empty__btn" routerLink="/events">Browse all events</a>
  </div>
</div>

<!-- event-list.component.html -->
<div class="event-list-container">

  <!-- Filters -->
  <section class="filters">
    <div class="filters__inner">

      <div class="filters__search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          class="filters__search-input"
          type="text"
          placeholder="Search events, artists or venues…"
          [value]="searchTerm"
          (input)="onSearchInput($event)"
          aria-label="Search events"
        >
        <button *ngIf="searchTerm" class="filters__clear" (click)="resetSearch()" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <div class="filters__pills">
        <button class="filters__pill" [class.filters__pill--active]="dateFilter === 'upcoming'" (click)="filterByDate('upcoming')">
          Upcoming
        </button>
        <button class="filters__pill" [class.filters__pill--active]="dateFilter === 'past'" (click)="filterByDate('past')">
          Past
        </button>
        <button class="filters__pill" [class.filters__pill--active]="dateFilter === 'all'" (click)="filterByDate('all')">
          All
        </button>
      </div>

    </div>
  </section>

  <!-- Loading -->
  <div class="state-wrap" *ngIf="isLoading">
    <div class="state state--loading">
      <div class="spinner"></div>
      <p>Loading events…</p>
    </div>
  </div>

  <!-- Error -->
  <div class="state-wrap" *ngIf="error && !isLoading">
    <div class="state state--error">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 8V12M12 16H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h3>Couldn't load events</h3>
      <p>{{ error }}</p>
      <button class="btn-retry" (click)="retryLoadEvents()">Try again</button>
    </div>
  </div>

  <!-- Events -->
  <section class="events" *ngIf="!isLoading && !error">
    <div class="events__inner">

      <!-- Grid -->
      <div class="events__grid" *ngIf="filteredEvents.length > 0">
        <div
          *ngFor="let event of filteredEvents"
          class="card"
          [class.card--past]="event.isPast"
          [routerLink]="['/events', event.id]"
          role="button"
          tabindex="0"
          (keydown.enter)="$event.preventDefault()"
        >
          <!-- Image -->
          <div class="card__img">
            <img
              [src]="event.bannerImage"
              [alt]="event.title"
              loading="lazy"
              (error)="handleImageError($event)"
            />
            <div class="card__img-overlay"></div>

            <!-- Past badge -->
            <span class="card__badge card__badge--past" *ngIf="event.isPast">Past event</span>

            <!-- Price chip on image -->
            <div class="card__price-chip" *ngIf="!event.isPast && event.isActive">
              From {{ event.startingFromPrice }}
            </div>
          </div>

          <!-- Body -->
          <div class="card__body">
            <div class="card__meta">
              <span class="card__date">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
                </svg>
                {{ event.startDate | formatDate }}
              </span>
              <span class="card__location">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                {{ event.venueCity }}
              </span>
            </div>

            <h3 class="card__title">{{ event.title }}</h3>
            <p class="card__desc">{{ event.shortDescription }}</p>

            <div class="card__footer">
              <div class="card__venue">{{ event.venueName }}</div>
              <button
                class="card__btn"
                [class.card__btn--past]="event.isPast || !event.isActive"
                (click)="$event.stopPropagation()"
                [routerLink]="['/events', event.id]"
                [attr.aria-label]="'Get tickets for ' + event.title"
              >
                {{ (event.isPast || !event.isActive) ? 'Details' : 'Get tickets' }}
                <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                  <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty -->
      <div class="state state--empty" *ngIf="filteredEvents.length === 0 && !isLoading">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <h3>No events found</h3>
        <p>Try adjusting your search or filters</p>
        <button class="btn-retry" (click)="resetFilters()">Reset filters</button>
      </div>

    </div>
  </section>

</div>

<section class="contact-section">
  <div class="contact-wrap">

    <!-- Left: copy -->
    <div class="contact-left">
      <div class="contact-eyebrow">
        <span class="eyebrow-pip"></span>
        Don't Miss Out
      </div>
      <h2 class="contact-title">Ready for the<br>experience?</h2>
      <p class="contact-sub">Book your tickets now for the show of the year.</p>

      <button class="cta-btn" (click)="scrollTo.emit('venues')">
        Get Tickets Now
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Right: contact cards -->
    <div class="contact-right">
      <p class="contact-right__label">For tickets &amp; enquiries</p>
      <div class="contact-cards">
        <a
          class="contact-card"
          *ngFor="let c of contacts"
          [href]="'tel:' + c.number.replace(' ', '')"
        >
          <div class="contact-card__icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 2h3l1.5 3.5-1.75 1.25A9 9 0 0 0 9.25 10.25L10.5 8.5 14 10v3a1 1 0 0 1-1 1A12 12 0 0 1 2 3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="contact-card__body">
            <span class="contact-card__name">{{ c.name }}</span>
            <span class="contact-card__number">{{ c.number }}</span>
          </div>
          <svg class="contact-card__arrow" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2.5 7h9M8 3.5L11.5 7 8 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

  </div>
</section>

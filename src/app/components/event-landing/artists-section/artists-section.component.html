<section class="artists">
  <div class="artists-wrap">

    <!-- Header -->
    <div class="section-header">
      <div class="header-left">
        <div class="header-eyebrow">
          <span class="eyebrow-pip"></span>
          The Stars
        </div>
        <h2 class="section-title">Meet the Dream Team</h2>
        <p class="section-subtitle">World-class performers ready to set the stage on fire</p>
      </div>

    </div>

    <!-- Artists grid — compact cards -->
    <div class="artists-grid">
      <div
        class="artist-card"
        *ngFor="let artist of artists"
        (click)="openArtist.emit(artist)"
        role="button"
        tabindex="0"
        (keydown.enter)="openArtist.emit(artist)"
      >
        <!-- Photo -->
        <div class="artist-photo">
          <img [src]="artist.imageUrl" [alt]="artist.name" loading="lazy" />
          <div class="artist-overlay">
            <span class="overlay-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M3 8h10M8.5 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
          <!-- Instagram link -->
          <a
            *ngIf="artist.social?.instagram"
            class="ig-btn"
            [href]="'https://instagram.com/' + artist.social.instagram"
            target="_blank"
            rel="noopener"
            (click)="$event.stopPropagation()"
            aria-label="Instagram"
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
          </a>
        </div>

        <!-- Info -->
        <div class="artist-info">
          <p class="artist-name">{{ artist.name }}</p>
          <p class="artist-role">{{ artist.role }}</p>
        </div>
      </div>
    </div>

  </div>
</section>

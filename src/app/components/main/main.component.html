
<ng-container *ngIf="!eventlistonly" >
  <app-hero-slider
    [events]="events"
    [isLoading]="isLoading"
    (scrollToEvents)="onScrollToEvents()">
  </app-hero-slider>
</ng-container>
<div id="event-list">
  <app-event-list
    [events]="events"
    [isLoading]="isLoading"
    [error]="error"
    (retryLoad)="onRetryLoad()">
  </app-event-list>
</div>

<!doctype html>
<html lang="en">
<head>
  <!-- Meta Pixel loader only (no init/PageView here). Pixels are per-event and are
       initialised at runtime by PixelService via fbq('init', <eventPixelId>). -->
  <script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  </script>
  <!-- End Meta Pixel loader -->

  <meta charset="utf-8">
  <title>Little Crew & Co</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- Brand colours + dark page background baked in so the very first paint is dark (no light flash
       before the CSS bundle loads). The full palette lives in styles.littlecrew.scss. -->
  <style>
    :root{--brand-primary:#140B1F;--brand-secondary:#E9499A;--brand-accent:#B06CF2;}
    html,body{background-color:#140B1F;color:#F4EEF9;}
  </style>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CrowdPass</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="author" content="CrowdPass">

  <!-- Favicons — hrefs replaced at runtime by ConfigService -->
  <link rel="icon" href="https://eventmanagementimages.blob.core.windows.net/crowdpass/favicon.ico" sizes="32x32">
  <link rel="icon" href="https://eventmanagementimages.blob.core.windows.net/crowdpass/favicon.ico" sizes="96x96">
  <link rel="apple-touch-icon" sizes="180x180" href="https://eventmanagementimages.blob.core.windows.net/crowdpass/favicon.ico">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Open Graph — content replaced at runtime by ConfigService -->
  <meta property="og:url" content="https://crowdpass.co.uk/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_GB">
  <meta property="og:site_name" content="CrowdPass">
  <meta property="og:title" content="CrowdPass">
  <meta property="og:image" content="">

  <!-- Twitter Card — content replaced at runtime by ConfigService -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CrowdPass">
  <meta name="twitter:image" content="">
  <meta name="twitter:image:alt" content="CrowdPass">
</head>
<body>
  <app-root></app-root>
</body>
</html>

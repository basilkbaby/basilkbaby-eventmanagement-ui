name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - crowdpass-multi
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - crowdpass-multi

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Build the Manickath tenant OURSELVES (Oryx's auto-build does not reliably
      # honour a non-default Angular --configuration, which left the output folder
      # without an index.html). We then hand the finished files to the SWA action.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (manickath configuration)
        run: npm run build -- --configuration manickath

      # SWA reads routing/fallback rules from staticwebapp.config.json in the
      # uploaded artifact. Oryx used to copy it from the app root automatically;
      # since we skip the Oryx build, copy it into the build output ourselves.
      - name: Include staticwebapp.config.json
        run: cp staticwebapp.config.json dist/ticket-system-client/browser/

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BEACH_0CE05201E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "dist/ticket-system-client/browser" # already-built app content
          api_location: ""
          output_location: ""
          skip_app_build: true   # we built it above; don't let Oryx rebuild
          skip_api_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_BEACH_0CE05201E }}
          action: "close"
